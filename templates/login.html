<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibely - Sign In / Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/logo.png') }}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .gradient-title {
            background: linear-gradient(135deg, #ff416c, #ff4b2b, #8a2387, #e94057, #f27121);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .glass-card {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body>

    <!-- Header / Branding Section -->
    <div class="text-center mb-6 px-2">
        <span class="inline-block px-3 py-1 mb-3 text-xs font-semibold text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-full">
            ✨ Text-Only Social Network
        </span>
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight gradient-title mb-2">Vibely</h1>
        <p class="text-gray-400 text-xs md:text-sm">Share your thoughts, perspectives & vibes in pure text.<br>Powered by MySQL & real-time WebSockets.</p>
    </div>

    <!-- Main Auth Box -->
    <div class="w-full max-w-md glass-card rounded-2xl p-5 md:p-8">
        
        <!-- Tab Switcher Header -->
        <div class="flex border-b border-gray-800 mb-6 relative">
            <button onclick="switchTab('signin')" id="tab-signin" class="w-1/2 pb-3 text-sm font-semibold text-center text-indigo-400 transition">
                Login
            </button>
            <button onclick="switchTab('signup')" id="tab-signup" class="w-1/2 pb-3 text-sm font-semibold text-center text-gray-400 transition hover:text-gray-200">
                Sign Up
            </button>
            <div id="tab-indicator" class="absolute bottom-0 left-0 w-1/2 h-0.5 bg-gradient-to-r from-indigo-500 to-pink-500 transition-all duration-300"></div>
        </div>

        <!-- SIGN IN FORM -->
        <form id="form-signin" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Username or Email</label>
                <input type="text" name="username" placeholder="e.g. alex_admin" required
                    class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" name="password" placeholder="Enter your password" required
                    class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl text-white font-semibold text-sm btn-gradient shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2 mt-2">
                <span><i class="fa-solid fa-key"></i></span> Log In
            </button>
        </form>

        <!-- CREATE ACCOUNT FORM -->
        <form id="form-signup" action="/signup" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Choose Username</label>
                <input type="text" id="signup-username" name="username" placeholder="e.g. vibely_coder" required disabled
                    class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-pink-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
            </div>

            <!-- Email & Send OTP Button -->
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                <div class="flex gap-2">
                    <input type="email" id="signup-email" name="email" placeholder="alex@example.com" required
                        class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-pink-500 transition">
                    <button type="button" onclick="sendOtp()" id="send-otp-btn"
                        class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl whitespace-nowrap transition shadow-md">
                        Send OTP
                    </button>
                </div>
            </div>

            <!-- General Error / Status Message -->
            <p id="otp-error" class="text-xs text-red-400 hidden"></p>

            <!-- OTP Verification Box (Initially Hidden) -->
            <div id="otp-container" class="hidden space-y-2 p-3 bg-gray-900/50 border border-gray-800 rounded-xl">
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Enter 6-Digit OTP</label>
                <div class="flex gap-2">
                    <input type="text" id="otp-input" placeholder="123456" maxlength="6"
                        class="w-full px-3 py-2 rounded-lg bg-gray-900 border border-gray-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                    <button type="button" onclick="verifyOtp()"
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg transition">
                        Verify
                    </button>
                </div>
                <p id="otp-success" class="text-xs text-emerald-400 hidden mt-1">Email verified successfully! 🎉</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" id="signup-password" name="password" placeholder="Create strong password" required disabled
                    class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-pink-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Gender</label>
                <select id="signup-gender" name="gender" disabled class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-gray-700/80 text-white text-sm focus:outline-none focus:border-pink-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="others" selected>Prefer not to say / Others</option>
                </select>
            </div>

            <!-- Create Account & Join Button (Disabled by default until verified) -->
            <button type="submit" id="submit-signup-btn" disabled
                class="w-full py-3 px-4 rounded-xl text-white font-semibold text-sm btn-gradient shadow-lg shadow-pink-500/20 flex items-center justify-center gap-2 mt-2 opacity-50 cursor-not-allowed">
                <span><i class="fa-solid fa-rocket"></i></span> Create Account & Join
            </button>
        </form>

    </div>

    <!-- JavaScript Actions -->
    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const indicator = document.getElementById('tab-indicator');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabSignin.classList.add('text-indigo-400');
                tabSignin.classList.remove('text-gray-400');
                tabSignup.classList.add('text-gray-400');
                tabSignup.classList.remove('text-indigo-400');
                indicator.style.transform = 'translateX(0%)';
            } else {
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
                tabSignup.classList.add('text-indigo-400');
                tabSignup.classList.remove('text-gray-400');
                tabSignin.classList.add('text-gray-400');
                tabSignin.classList.remove('text-indigo-400');
                indicator.style.transform = 'translateX(100%)';
            }
        }

        function sendOtp() {
            const email = document.getElementById('signup-email').value;
            const sendBtn = document.getElementById('send-otp-btn');
            const errorEl = document.getElementById('otp-error');

            if (!email || !email.includes('@')) {
                errorEl.innerText = "Please enter a valid email address first.";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            sendBtn.innerText = "Sending...";
            sendBtn.disabled = true;

            fetch('/api/sendotp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('otp-container').classList.remove('hidden');
                    sendBtn.innerText = "Resend OTP";
                    sendBtn.disabled = false;
                } else {
                    errorEl.innerText = data.message || "Failed to send OTP.";
                    errorEl.classList.remove('hidden');
                    sendBtn.innerText = "Send OTP";
                    sendBtn.disabled = false;
                }
            })
            .catch(err => {
                console.error(err);
                errorEl.innerText = "Network error while sending OTP.";
                errorEl.classList.remove('hidden');
                sendBtn.innerText = "Send OTP";
                sendBtn.disabled = false;
            });
        }

        function verifyOtp() {
            const otp = document.getElementById('otp-input').value;
            const errorEl = document.getElementById('otp-error');
            const successEl = document.getElementById('otp-success');

            fetch('/api/verifyotp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp: otp })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    errorEl.classList.add('hidden');
                    successEl.classList.remove('hidden');
                    
                    // Lock email & OTP inputs
                    document.getElementById('signup-email').readOnly = true;
                    document.getElementById('send-otp-btn').disabled = true;
                    document.getElementById('otp-container').style.opacity = '0.7';
                    document.getElementById('otp-input').disabled = true;

                    // Unlock other input fields and submit button
                    document.getElementById('signup-username').disabled = false;
                    document.getElementById('signup-password').disabled = false;
                    document.getElementById('signup-gender').disabled = false;
                    
                    const submitBtn = document.getElementById('submit-signup-btn');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    successEl.classList.add('hidden');
                    errorEl.innerText = data.message || "Incorrect OTP. Please try again.";
                    errorEl.classList.remove('hidden');
                }
            });
        }
    </script>
</body>

</html>
